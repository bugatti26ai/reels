X.fillStyle='#f3ecdd';X.fillRect(0,0,W,H);
// newsprint columns faint
X.fillStyle='rgba(0,0,0,.06)';for(let c=0;c<4;c++)for(let y=1500;y<H;y+=26)X.fillRect(60+c*250,y,210*(0.6+r()*.4),10);
for(let y=60;y<240;y+=26)for(let c=0;c<4;c++)X.fillRect(60+c*250,y,210*(0.6+r()*.4),10);
// torn paper strip behind number
X.fillStyle='#e4dac4';X.beginPath();X.moveTo(0,360);for(let x=0;x<=W;x+=30)X.lineTo(x,350+r()*30);X.lineTo(W,860);for(let x=W;x>=0;x-=30)X.lineTo(x,850+r()*30);X.fill();
// halftone dots
for(let y=380;y<850;y+=22)for(let x=0;x<W;x+=22){const d=Math.max(0,1-Math.hypot(x-900,y-450)/500);if(d>0){X.fillStyle='rgba(200,16,46,.18)';X.beginPath();X.arc(x,y,d*9,0,7);X.fill()}}
// rising bar chart icon
const bx=360,by=1300;[[0,90],[1,150],[2,230],[3,330]].forEach(([i,h])=>{X.fillStyle=i==3?'#c8102e':'#1b1b1b';X.fillRect(bx+i*95,by-h-40,70,h)});
X.fillStyle='rgba(0,0,0,.0)';grain(.05);
