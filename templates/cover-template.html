<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
canvas{position:absolute;left:0;top:0}
#t{position:absolute;left:40px;right:40px;top:560px;text-align:center;font-family:'Comic Relief';font-weight:700;font-size:150px;line-height:1.02;color:#1a1208;letter-spacing:-3px;-webkit-text-stroke:5px #1a1208;font-size:158px;
 text-shadow:0 0 18px #fff6d8,0 0 36px #fff1c0,0 0 70px rgba(255,236,180,.9),0 0 120px rgba(255,230,160,.8);transform:rotate(-2deg)}
#t .u{position:relative;display:inline-block}
#t svg{position:absolute;left:-10px;right:-10px;bottom:-34px;width:calc(100% + 20px);height:60px}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="t">He said we’d<br>be the <span class="u">most?<svg viewBox="0 0 400 60" preserveAspectRatio="none"><path d="M6 40 C 120 14, 260 12, 394 30" stroke="#d99a1e" stroke-width="13" fill="none" stroke-linecap="round"/></svg></span></div>
<script>
const X=document.getElementById('c').getContext('2d'),W=1080,H=1920;
let s=42;const r=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};
function glow(x,y,rad,c,a){const g=X.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);X.fillStyle=g;X.fillRect(x-rad,y-rad,rad*2,rad*2)}
// sky
let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1d5c');g.addColorStop(.22,'#7a3f8f');g.addColorStop(.42,'#f29a5a');g.addColorStop(.58,'#ffd98a');g.addColorStop(.72,'#ffe9b8');g.addColorStop(1,'#c9873a');X.fillStyle=g;X.fillRect(0,0,W,H);
// stars top
for(let i=0;i<120;i++){X.fillStyle=`rgba(255,255,255,${r()*.8})`;X.beginPath();X.arc(r()*W,r()*420,r()*2.2,0,7);X.fill()}
// crescent moon
glow(860,260,160,'255,240,200',.5);X.fillStyle='#fff6dc';X.beginPath();X.arc(860,260,62,0,7);X.fill();X.fillStyle='#4a2c74';X.beginPath();X.arc(885,245,56,0,7);X.fill();
// sun glow behind kaaba
glow(540,1250,900,'255,244,200',.85);glow(540,1250,420,'255,255,240',.9);
// light rays
X.save();X.translate(540,1250);X.globalCompositeOperation='lighter';
for(let i=0;i<22;i++){const a=-Math.PI+i*(Math.PI/21)+ (r()-.5)*.05;X.rotate(0);const w=.03+r()*.04;X.beginPath();X.moveTo(0,0);X.arc(0,0,1500,a-w,a+w);X.closePath();X.fillStyle=`rgba(255,240,190,${.03+r()*.05})`;X.fill()}
X.restore();
// clouds
function cloud(cx,cy,sc,col,a){for(let i=0;i<9;i++){const x=cx+(r()-.5)*360*sc,y=cy+(r()-.5)*70*sc,rad=(70+r()*90)*sc;const gg=X.createRadialGradient(x,y-rad*.3,0,x,y,rad);gg.addColorStop(0,`rgba(${col},${a})`);gg.addColorStop(1,`rgba(${col},0)`);X.fillStyle=gg;X.beginPath();X.arc(x,y,rad,0,7);X.fill()}}
cloud(150,470,1.3,'255,200,170',.55);cloud(950,560,1.2,'255,190,160',.5);cloud(220,1010,1.4,'255,236,200',.7);cloud(900,980,1.4,'255,236,200',.7);cloud(540,420,1.1,'230,160,190',.35);
// distant ground / horizon city
X.fillStyle='rgba(120,70,40,.35)';for(let i=0;i<30;i++){const x=i*38,h=20+r()*60;X.fillRect(x,1330-h,30,h)}
// minarets
function minaret(x,h){X.fillStyle='rgba(150,95,55,.55)';X.fillRect(x-9,1330-h,18,h);X.beginPath();X.moveTo(x-14,1330-h);X.lineTo(x,1330-h-40);X.lineTo(x+14,1330-h);X.fill()}
minaret(170,260);minaret(910,240);minaret(80,190);minaret(1000,200);
// ground plaza
g=X.createLinearGradient(0,1320,0,H);g.addColorStop(0,'#fff3d6');g.addColorStop(.4,'#f2d49a');g.addColorStop(1,'#b97c38');X.fillStyle=g;X.fillRect(0,1320,W,H-1320);
// rings of figures (ellipses) around kaaba
const KX=540,KY=1390;X.save();
function figure(x,y,sc,a){X.globalAlpha=a;X.fillStyle='#fffdf6';X.beginPath();X.ellipse(x,y-14*sc,8*sc,15*sc,0,0,7);X.fill();X.beginPath();X.arc(x,y-34*sc,6.5*sc,0,7);X.fill();
 X.fillStyle='rgba(160,110,50,.25)';X.beginPath();X.ellipse(x,y+1*sc,9*sc,3*sc,0,0,7);X.fill();X.globalAlpha=1}
const figs=[];
for(let ring=0;ring<9;ring++){const rx=200+ring*70,ry=55+ring*22;const n=34+ring*14;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+ring*.3;figs.push([KX+Math.cos(a)*rx,KY+Math.sin(a)*ry,.7+ring*.09+ (Math.sin(a)>0?.15:0)])}}
// streams of people from bottom corners
for(let k=0;k<160;k++){const t=r();const side=k%2?1:-1;const x=KX+side*(120+t*520)+(r()-.5)*60;const y=KY+120+t*420+(r()-.5)*30;figs.push([x,y,1+t*1.3])}
figs.sort((a,b)=>a[1]-b[1]);
const back=figs.filter(f=>f[1]<KY),front=figs.filter(f=>f[1]>=KY);
back.forEach(f=>figure(f[0],f[1],f[2],.95));
// kaaba
X.save();X.translate(KX,KY);X.scale(1.35,1.35);X.translate(-KX,-KY);glow(KX,KY-120,330,'255,250,220',.9);
X.fillStyle='#14110f';X.beginPath();X.moveTo(KX-150,KY-250);X.lineTo(KX+40,KY-275);X.lineTo(KX+150,KY-245);X.lineTo(KX+150,KY+5);X.lineTo(KX+40,KY+25);X.lineTo(KX-150,KY+5);X.closePath();X.fill();
X.fillStyle='#24201c';X.beginPath();X.moveTo(KX+40,KY-275);X.lineTo(KX+150,KY-245);X.lineTo(KX+150,KY+5);X.lineTo(KX+40,KY+25);X.fill();
// gold band
X.strokeStyle='#e8b64a';X.lineWidth=16;X.beginPath();X.moveTo(KX-150,KY-185);X.lineTo(KX+40,KY-205);X.lineTo(KX+150,KY-177);X.stroke();
X.strokeStyle='rgba(255,230,150,.7)';X.lineWidth=3;X.beginPath();X.moveTo(KX-150,KY-195);X.lineTo(KX+40,KY-215);X.lineTo(KX+150,KY-187);X.stroke();
// door
X.fillStyle='#d9a540';X.fillRect(KX+70,KY-110,48,110);X.fillStyle='rgba(255,240,180,.6)';X.fillRect(KX+76,KY-102,36,6);
// rim light
X.strokeStyle='rgba(255,240,200,.8)';X.lineWidth=4;X.beginPath();X.moveTo(KX-150,KY-250);X.lineTo(KX+40,KY-275);X.lineTo(KX+150,KY-245);X.stroke();
X.restore();front.forEach(f=>figure(f[0],f[1],f[2],1));
// golden light beam up from kaaba
X.save();X.globalCompositeOperation='lighter';g=X.createLinearGradient(0,KY-270,0,0);g.addColorStop(0,'rgba(255,240,190,.55)');g.addColorStop(1,'rgba(255,240,190,0)');X.fillStyle=g;X.beginPath();X.moveTo(KX-60,KY-260);X.lineTo(KX+60,KY-260);X.lineTo(KX+160,0);X.lineTo(KX-160,0);X.fill();X.restore();
// sparkles / bokeh
X.globalCompositeOperation='lighter';
for(let i=0;i<70;i++){const x=r()*W,y=300+r()*1300,rad=2+r()*9;glow(x,y,rad*3,'255,230,160',.35*r()+.1)}
for(let i=0;i<26;i++){const x=r()*W,y=200+r()*1500,l=8+r()*16;X.strokeStyle=`rgba(255,250,220,${.5+r()*.5})`;X.lineWidth=2;X.beginPath();X.moveTo(x-l,y);X.lineTo(x+l,y);X.moveTo(x,y-l);X.lineTo(x,y+l);X.stroke()}
X.globalCompositeOperation='source-over';
// soft glow behind title
glow(540,700,560,'255,246,215',.55);
// vignette
const v=X.createRadialGradient(540,1000,500,540,1000,1300);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(40,15,30,.45)');X.fillStyle=v;X.fillRect(0,0,W,H);
</script></body></html>
